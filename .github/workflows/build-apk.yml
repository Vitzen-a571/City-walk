name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unpack
        run: |
          unzip -q -o *.zip
          mkdir -p www/source www/textures
          mv index.html www/
          mv *.jpeg www/textures/
          mv Untitled.glb.part* www/source/
          cat www/source/Untitled.glb.part* > www/source/Untitled.glb
          rm www/source/Untitled.glb.part*
      - name: Install
        run: |
          npm install
          mkdir -p www/lib
          cp node_modules/three/build/three.module.js www/lib/
          cp -r node_modules/three/examples/jsm www/lib/jsm
      - name: Android
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's|<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">|&\n        <item name="android:windowFullscreen">true</item>|' android/app/src/main/res/values/styles.xml || true
      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CityWalk.apk
          gh release create "build-${{ github.run_number }}" CityWalk.apk --title "City Walk ${{ github.run_number }}" --notes "APK"
